<html>
<head>
    <title>Ajouter Joueur</title>
    <meta charset="utf-8"/>
</head>
<body>
<h1>Ajouter un joueur</h1>
<form action="add-player" method="post">
    <label for="jno"></label>
    <input type="text" id="jno" name="jno" placeholder="Numéro du joueur" required>
    <br>
    <label for="pseudo"></label>
    <input type="text" id="pseudo" name="pseudo" placeholder="Pseudo du joueur" required>
    <br>
    <label for="email"></label>
    <input type="email" id="email" name="email" placeholder="Email du joueur" required>
    <br>
    <label for="pwd"></label>
    <input type="password" id="pwd" name="pwd" placeholder="Mot de passe du joueur" required>
    <br>
    <label for="elo"></label>
    <input type="number" id="elo" name="elo" placeholder="Elo du joueur" required>
    <br>
    <button type="submit">Ajouter</button>
</form>
</body>
</html>
